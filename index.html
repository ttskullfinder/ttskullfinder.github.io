<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skull Finder</title>
    <style>
      :root {
        --bg: #0f0f10;
        --bg-2: #121214;
        --bg-3: #161618;
        --bg-cell: #1a1a1d;
        --border: #2a2a2e;
        --text: #eaeaea;
        --text-2: #d0d0d0;
        --text-3: #aaa;
        --shadow: rgba(0, 0, 0, 0.4);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      #title {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.5px;
        margin-bottom: 18px;
        color: var(--text);
        opacity: 0.9;
      }

      #status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        max-width: 420px;
        margin-bottom: 12px;
        gap: 10px;
      }

      .stat-box {
        flex: 1;
        background: var(--bg-3);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        text-align: center;
        font-size: 14px;
        color: var(--text-2);
      }

      #smiley-btn {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg-3);
        color: var(--text);
        font-size: 18px;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      #smiley-btn:hover {
        background: var(--bg-2);
        transform: translateY(-1px);
      }

      #smiley-btn:active {
        transform: scale(0.95);
      }

      #board-container {
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px;
        box-shadow: 0 10px 30px var(--shadow);
        position: relative;
      }

      .skull-overlay {
        position: absolute;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        pointer-events: none;
        z-index: 10;
        background: #3a1212;
        border: 1px solid #ff4d4d;
      }

      @keyframes win-anim {
        0% {
          box-shadow:
            0 10px 30px var(--shadow),
            0 0 0px rgba(126, 231, 135, 0);
          border-color: var(--border);
        }
        25% {
          box-shadow:
            0 10px 40px rgba(126, 231, 135, 0.35),
            0 0 32px rgba(126, 231, 135, 0.25);
          border-color: rgba(126, 231, 135, 0.6);
        }
        60% {
          box-shadow:
            0 10px 36px rgba(126, 231, 135, 0.2),
            0 0 18px rgba(126, 231, 135, 0.12);
          border-color: rgba(126, 231, 135, 0.35);
        }
        100% {
          box-shadow:
            0 10px 30px var(--shadow),
            0 0 0px rgba(126, 231, 135, 0);
          border-color: var(--border);
        }
      }

      @keyframes lose-anim {
        0% {
          box-shadow: 0 10px 30px var(--shadow);
          border-color: var(--border);
        }
        10% {
          box-shadow: 0 10px 30px rgba(255, 77, 77, 0.5);
          border-color: rgba(255, 77, 77, 0.8);
        }
        22% {
          box-shadow: 0 10px 30px rgba(255, 77, 77, 0.4);
          border-color: rgba(255, 77, 77, 0.7);
        }
        34% {
          box-shadow: 0 10px 30px rgba(255, 77, 77, 0.3);
          border-color: rgba(255, 77, 77, 0.5);
        }
        46% {
          box-shadow: 0 10px 28px rgba(255, 77, 77, 0.2);
          border-color: rgba(255, 77, 77, 0.3);
        }
        100% {
          box-shadow: 0 10px 30px var(--shadow);
          border-color: var(--border);
        }
      }

      @keyframes shake-anim {
        0% {
          transform: translateX(0);
        }
        10% {
          transform: translateX(-7px);
        }
        22% {
          transform: translateX(6px);
        }
        34% {
          transform: translateX(-5px);
        }
        46% {
          transform: translateX(4px);
        }
        58% {
          transform: translateX(-2px);
        }
        70% {
          transform: translateX(1px);
        }
        100% {
          transform: translateX(0);
        }
      }

      @keyframes skull-pulse {
        0% {
          transform: scale(1);
          background: #3a1212;
        }
        30% {
          transform: scale(1.22);
          background: #5a1a1a;
        }
        55% {
          transform: scale(0.95);
          background: #3a1212;
        }
        75% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }

      #board-container.anim-win {
        animation: win-anim 1.1s ease-out forwards;
      }
      #board-container.anim-lose {
        animation: lose-anim 0.55s ease-out forwards;
      }
      #board-shake.anim-shake {
        animation: shake-anim 0.55s ease-out forwards;
      }
      .cell.skull-pulse {
        animation: skull-pulse 0.5s ease-out forwards;
      }

      #board {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }

      .cell {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        background: var(--bg-cell);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        cursor: pointer;
        transition: all 0.12s ease;
        user-select: none;
      }

      .cell:hover {
        background: #222226;
      }

      .cell.revealed {
        background: #141416;
        border-color: #333;
        cursor: default;
      }

      .cell.locked {
        opacity: 0.35;
        cursor: not-allowed;
      }

      /* bomb */
      .cell.skull-dead {
        background: #3a1212;
        border-color: #ff4d4d;
      }

      /* numbers */
      .n1 {
        color: #7aa2f7;
      }
      .n2 {
        color: #9ece6a;
      }
      .n3 {
        color: #f7768e;
      }
      .n4 {
        color: #bb9af7;
      }
      .n5 {
        color: #e0af68;
      }
      .n6 {
        color: #7dcfff;
      }
      .n7 {
        color: #c0caf5;
      }
      .n8 {
        color: #9aa0a6;
      }

      #message {
        margin-top: 14px;
        font-size: 14px;
        color: #aaa;
        height: 20px;
        text-align: center;
      }

      #message.win {
        color: #7ee787;
      }

      #message.lose {
        color: #ff6b6b;
      }

      #seed-panel {
        margin-top: 16px;
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      #seed-row {
        display: flex;
        gap: 8px;
      }

      #seed-input {
        flex: 1;
        background: #161618;
        border: 1px solid #2a2a2e;
        border-radius: 10px;
        padding: 10px;
        color: #eaeaea;
        outline: none;
      }

      #seed-input:focus {
        border-color: #444;
      }

      .seed-btn {
        background: transparent;
        border: 1px solid #2a2a2e;
        color: #cfcfcf;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.12s ease;
        white-space: nowrap;
        line-height: 1;
      }

      .seed-btn:hover {
        background: #1e1e22;
      }

      #seed-hint {
        font-size: 12px;
        color: #666;
        text-align: center;
      }

      #copy-toast {
        font-size: 12px;
        color: #7ee787;
        text-align: center;
        height: 14px;
      }
    </style>
    <script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.js"></script>
  </head>
  <body>
    <div id="title">skullfinder</div>

    <div id="status-bar">
      <div class="stat-box" id="skull-count">💀 6</div>
      <button id="smiley-btn" title="New game">🙂</button>
      <div class="stat-box" id="timer">
        <i
          data-lucide="timer"
          style="
            width: 13px;
            height: 13px;
            vertical-align: middle;
            margin-right: 4px;
            margin-bottom: 2px;
            stroke-width: 2.2;
          "
        ></i
        ><span id="timer-text">0s</span>
      </div>
    </div>

    <div id="board-container">
      <div id="board-shake">
        <div id="board"></div>
      </div>
    </div>

    <div id="message"></div>

    <div id="seed-panel">
      <div id="seed-row">
        <input
          id="seed-input"
          type="text"
          placeholder="paste seed to load a board..."
          maxlength="20"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="seed-btn" id="load-btn">load</button>
        <button class="seed-btn" id="copy-btn">copy seed</button>
        <button class="seed-btn" id="retry-btn">
          <i
            data-lucide="rotate-ccw"
            style="
              width: 12px;
              height: 12px;
              vertical-align: middle;
              margin-right: 4px;
              margin-bottom: 1px;
              stroke-width: 2.2;
            "
          ></i
          >retry
        </button>
      </div>
      <div id="copy-toast"></div>
      <div id="seed-hint">
        [n] new game <span style="margin: 0 6px">·</span> [r] retry
      </div>
    </div>

    <script>
      const COLS = 7,
        ROWS = 7;
      const BOMB_VAL = 12;
      const HIDDEN = 10;
      const HIDDEN_BOMB = 11;

      let hiddenData = [],
        gridData = [],
        finished = false,
        firstClick = true;
      let timerInterval = null,
        elapsed = 0;
      let currentSeed = null; // numeric seed for current board

      // Seeded RNG
      function mulberry32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function randomInt(rng, min, max) {
        return Math.floor(rng() * (max - min + 1)) + min;
      }

      // Seed encoding, 6char base36
      function seedToCode(seed) {
        return seed.toString(36).toUpperCase().padStart(6, "0");
      }

      function codeToSeed(code) {
        const n = parseInt(code.trim(), 36);
        return isNaN(n) ? null : n;
      }

      function newRandomSeed() {
        let seed,
          attempts = 0;
        do {
          seed = Math.floor(Math.random() * 2176782336);
          const { hd } = generateGrid(seed);
          if (!wouldInstaWin(hd)) return seed;
          attempts++;
        } while (attempts < 200);
        return seed; // give up after 200 tries
      }

      function neighborSum(hd, x, y) {
        let s = 0;
        for (let dx = -1; dx <= 1; dx++)
          for (let dy = -1; dy <= 1; dy++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx,
              ny = y + dy;
            if (
              nx >= 0 &&
              nx < COLS &&
              ny >= 0 &&
              ny < ROWS &&
              hd[nx][ny] === BOMB_VAL
            )
              s++;
          }
        return s;
      }

      function rowSum(hd, y) {
        let s = 0;
        for (let x = 0; x < COLS; x++) if (hd[x][y] === BOMB_VAL) s++;
        return s;
      }

      function generateGrid(seed) {
        const rng = mulberry32(seed);
        const hd = Array.from({ length: COLS }, () => Array(ROWS).fill(0));
        const gd = Array.from({ length: COLS }, () => Array(ROWS).fill(HIDDEN));

        const numBombs = Math.floor((COLS * ROWS) / 8) + 1; // = 7
        let bomb = 0,
          sanity = 1000;

        while (bomb < numBombs && sanity > 0) {
          sanity--;
          const col = randomInt(rng, 0, COLS - 1);
          const row = randomInt(rng, 1, ROWS - 1); // row 0 always safe
          if (
            hd[col][row] !== BOMB_VAL &&
            neighborSum(hd, col, row) < 2 &&
            rowSum(hd, row) < numBombs / 3
          ) {
            hd[col][row] = BOMB_VAL;
            bomb++;
          }
        }

        for (let x = 0; x < COLS; x++)
          for (let y = 0; y < ROWS; y++)
            gd[x][y] = hd[x][y] === BOMB_VAL ? HIDDEN_BOMB : HIDDEN;

        return { hd, gd, bombCount: bomb };
      }

      function wouldInstaWin(hd) {
        // Simulate revealing row 0 and check if flood fill reaches top row (y = ROWS-1)
        const sim = Array.from({ length: COLS }, (_, x) =>
          Array.from({ length: ROWS }, (_, y) =>
            hd[x][y] === BOMB_VAL ? HIDDEN_BOMB : HIDDEN,
          ),
        );

        function simNeighborSum(x, y) {
          let s = 0;
          for (let dx = -1; dx <= 1; dx++)
            for (let dy = -1; dy <= 1; dy++) {
              if (dx === 0 && dy === 0) continue;
              const nx = x + dx,
                ny = y + dy;
              if (
                nx >= 0 &&
                nx < COLS &&
                ny >= 0 &&
                ny < ROWS &&
                hd[nx][ny] === BOMB_VAL
              )
                s++;
            }
          return s;
        }

        function simReveal(x, y) {
          if (sim[x][y] !== HIDDEN) return;
          const n = simNeighborSum(x, y);
          sim[x][y] = n;
          if (n === 0) {
            for (let dx = -1; dx <= 1; dx++)
              for (let dy = -1; dy <= 1; dy++) {
                if (dx === 0 && dy === 0) continue;
                const nx = x + dx,
                  ny = y + dy;
                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS)
                  simReveal(nx, ny);
              }
          }
        }

        for (let x = 0; x < COLS; x++) simReveal(x, 0);

        // Check if any top row cell got revealed
        for (let x = 0; x < COLS; x++) {
          const v = sim[x][ROWS - 1];
          if (v !== HIDDEN && v !== HIDDEN_BOMB && v !== BOMB_VAL) return true;
        }
        return false;
      }

      function neighborReveal(x, y, showBomb = false) {
        if (showBomb && gridData[x][y] === HIDDEN_BOMB) {
          gridData[x][y] = BOMB_VAL;
          return;
        }
        if (gridData[x][y] !== HIDDEN) return;
        const n = neighborSum(hiddenData, x, y);
        gridData[x][y] = n;
        if (n === 0) {
          for (let dx = -1; dx <= 1; dx++)
            for (let dy = -1; dy <= 1; dy++) {
              if (dx === 0 && dy === 0) continue;
              const nx = x + dx,
                ny = y + dy;
              if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS)
                neighborReveal(nx, ny);
            }
        }
      }

      function revealAll() {
        for (let x = 0; x < COLS; x++)
          for (let y = 0; y < ROWS; y++) neighborReveal(x, y, true);
      }

      function checkWin() {
        for (let x = 0; x < COLS; x++) {
          const v = gridData[x][ROWS - 1];
          if (v !== HIDDEN && v !== HIDDEN_BOMB && v !== BOMB_VAL) return true;
        }
        return false;
      }

      function win() {
        finished = true;
        stopTimer();
        document.getElementById("smiley-btn").textContent = "😎";
        const msg = document.getElementById("message");
        msg.textContent = "you win!";
        msg.className = "win";
        revealAll();
        renderBoard();
        document.getElementById("board-container").classList.add("board-win");
        // Trigger green bloom, remove then readd to restart if needed
        const bw = document.getElementById("board-container");
        bw.classList.remove("anim-win");
        void bw.offsetWidth; // reflow
        bw.classList.add("anim-win");
      }

      function lose(hitX, hitY) {
        finished = true;
        stopTimer();
        document.getElementById("smiley-btn").textContent = "😵";
        const msg = document.getElementById("message");
        msg.textContent = "try again.";
        msg.className = "lose";
        revealAll();
        renderBoard();
        // Shake only the inner board wrapper (not the skull overlay)
        const bw = document.getElementById("board-container");
        bw.classList.remove("anim-lose");
        void bw.offsetWidth;
        bw.classList.add("anim-lose");
        const bs = document.getElementById("board-shake");
        bs.classList.remove("anim-shake");
        void bs.offsetWidth;
        bs.classList.add("anim-shake");
        // Pulse the hit skull cell
        const cell = document.querySelector(
          `[data-x="${hitX}"][data-y="${hitY}"]`,
        );
        if (cell) {
          cell.classList.add("skull-dead", "skull-pulse");
          cell.textContent = "💀";
          // Create an overlay skull that sits above the shaking board
          const container = document.getElementById("board-container");
          const cellRect = cell.getBoundingClientRect();
          const containerRect = container.getBoundingClientRect();
          const overlay = document.createElement("div");
          overlay.className = "skull-overlay skull-pulse";
          overlay.textContent = "💀";
          overlay.style.width = cellRect.width + "px";
          overlay.style.height = cellRect.height + "px";
          overlay.style.left = cellRect.left - containerRect.left + "px";
          overlay.style.top = cellRect.top - containerRect.top + "px";
          container.appendChild(overlay);
          // Hide the original cell so it doesn't double-render under the overlay
          cell.textContent = "";
          cell.style.visibility = "hidden";
          cell.classList.remove("skull-dead", "skull-pulse");
        }
      }

      function startTimer() {
        elapsed = 0;
        document.getElementById("timer-text").textContent = "0s";
        timerInterval = setInterval(() => {
          elapsed++;
          document.getElementById("timer-text").textContent =
            Math.min(elapsed, 999) + "s";
        }, 1000);
      }

      function stopTimer() {
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
      }

      function renderBoard() {
        const cells = document.querySelectorAll(".cell");
        cells.forEach((cell) => {
          const x = parseInt(cell.dataset.x);
          const y = parseInt(cell.dataset.y);
          const val = gridData[x][y];
          cell.className = "cell";
          cell.textContent = "";

          if (val === HIDDEN || val === HIDDEN_BOMB) {
            if (!isCellAccessible(x, y)) cell.classList.add("locked");
          } else if (val === BOMB_VAL) {
            cell.textContent = "💀";
            cell.classList.add("skull-revealed");
          } else if (val === 0) {
            cell.classList.add("revealed");
          } else {
            cell.textContent = val;
            cell.classList.add("revealed", "n" + val);
          }
        });
      }

      function buildBoard() {
        const board = document.getElementById("board");
        board.innerHTML = "";
        for (let y = ROWS - 1; y >= 0; y--) {
          for (let x = 0; x < COLS; x++) {
            const cell = document.createElement("div");
            cell.className = "cell";
            cell.dataset.x = x;
            cell.dataset.y = y;
            cell.addEventListener("click", () => handleClick(x, y));
            board.appendChild(cell);
          }
        }
      }

      function isCellAccessible(x, y) {
        // Bottom row (y=0) is always accessible
        if (y === 0) return true;
        // A cell is accessible only if it has at least one revealed (non-hidden, non-bomb) neighbor
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            if (dx === 0 && dy === 0) continue;
            const nx = x + dx,
              ny = y + dy;
            if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
            const v = gridData[nx][ny];
            if (v !== HIDDEN && v !== HIDDEN_BOMB && v !== BOMB_VAL)
              return true;
          }
        }
        return false;
      }

      function handleClick(x, y) {
        if (finished) return;
        const val = gridData[x][y];
        if (val !== HIDDEN && val !== HIDDEN_BOMB) return;

        // Can only click a cell adjacent (incl. diagonal) to a revealed cell, or in row 0
        if (!isCellAccessible(x, y)) return;

        if (firstClick) {
          firstClick = false;
          startTimer();
        }

        if (hiddenData[x][y] === BOMB_VAL) {
          gridData[x][y] = BOMB_VAL;
          lose(x, y);
        } else {
          neighborReveal(x, y);
          renderBoard();
          if (checkWin()) win();
        }
      }

      function resetState() {
        stopTimer();
        finished = false;
        firstClick = true;
        elapsed = 0;
        document.getElementById("timer-text").textContent = "0s";
        document.getElementById("message").textContent = "";
        document.getElementById("message").className = "";
        document.getElementById("smiley-btn").textContent = "🙂";
        document
          .getElementById("board-container")
          .classList.remove("board-win", "anim-win", "anim-lose");
        document.getElementById("board-shake").classList.remove("anim-shake");
        // Remove any skull overlays
        document
          .querySelectorAll(".skull-overlay")
          .forEach((el) => el.remove());
        document
          .querySelectorAll(".cell")
          .forEach((el) => (el.style.visibility = ""));
      }

      function loadSeed(seed) {
        currentSeed = seed;
        const { hd, gd, bombCount } = generateGrid(seed);
        hiddenData = hd;
        gridData = gd;
        document.getElementById("skull-count").textContent = "💀 " + bombCount;
        document.getElementById("seed-input").value = seedToCode(seed);
        buildBoard();
        // Auto reveal the entire bottom row
        // neighborReveal handles flood fill
        for (let x = 0; x < COLS; x++) neighborReveal(x, 0);
        renderBoard();
      }

      function newGame() {
        resetState();
        loadSeed(newRandomSeed());
      }

      function retryGame() {
        if (currentSeed === null) {
          newGame();
          return;
        }
        resetState();
        loadSeed(currentSeed);
      }

      function showToast(msg) {
        const t = document.getElementById("copy-toast");
        t.textContent = msg;
        t.style.opacity = "1";
        setTimeout(() => {
          t.style.opacity = "0";
        }, 1800);
      }

      document.getElementById("copy-btn").addEventListener("click", () => {
        if (currentSeed === null) return;
        const code = seedToCode(currentSeed);
        navigator.clipboard
          .writeText(code)
          .then(() => showToast("seed copied: " + code))
          .catch(() => showToast("seed: " + code));
      });

      document.getElementById("load-btn").addEventListener("click", () => {
        const val = document.getElementById("seed-input").value.trim();
        if (!val) return;
        const seed = codeToSeed(val);
        if (seed === null) {
          showToast("invalid seed");
          return;
        }
        const { hd } = generateGrid(seed);
        if (wouldInstaWin(hd)) {
          showToast("seed insta-wins — try another");
          return;
        }
        resetState();
        loadSeed(seed);
      });

      document.getElementById("seed-input").addEventListener("keydown", (e) => {
        if (e.key === "Enter") document.getElementById("load-btn").click();
      });

      document.getElementById("retry-btn").addEventListener("click", retryGame);

      document.getElementById("smiley-btn").addEventListener("click", newGame);
      document
        .getElementById("smiley-btn")
        .addEventListener("mousedown", function () {
          this.classList.add("pressed");
        });
      document
        .getElementById("smiley-btn")
        .addEventListener("mouseup", function () {
          this.classList.remove("pressed");
        });

      document
        .getElementById("board-container")
        .addEventListener("contextmenu", (e) => e.preventDefault());

      document.getElementById("board").addEventListener("mousedown", (e) => {
        if (finished) return;
        const cell = e.target.closest(".cell");
        if (!cell) return;
        const x = parseInt(cell.dataset.x);
        const y = parseInt(cell.dataset.y);
        const val = gridData[x][y];
        if ((val === HIDDEN || val === HIDDEN_BOMB) && isCellAccessible(x, y)) {
          document.getElementById("smiley-btn").textContent = "😮";
        }
      });
      document.addEventListener("mouseup", () => {
        if (!finished) document.getElementById("smiley-btn").textContent = "🙂";
      });

      document.addEventListener("keydown", (e) => {
        // Ignore if typing in the seed input
        if (document.activeElement === document.getElementById("seed-input"))
          return;
        if (e.key === "r" || e.key === "R") retryGame();
        if (e.key === "n" || e.key === "N") newGame();
      });

      newGame();
      lucide.createIcons();
    </script>
  </body>
</html>
